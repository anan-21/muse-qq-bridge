name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check Muse script dependencies and syntax
        run: |
          command -v curl
          command -v jq
          bash -n muse/qq-bridge-inbox.sh muse/qq-bridge-reply.sh
      - run: python -m unittest discover -v
  dsh-muse-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python -m unittest discover -s addons/dsh-muse -p 'test_*.py' -v
      - run: python -m unittest discover -s addons/dsh-muse/integration -p 'test_*.py' -v
      - run: node --test addons/dsh-muse/client/*.test.mjs addons/dsh-muse/integration/test_*.mjs
      - run: bash -n addons/dsh-muse/muse-inbox.sh
